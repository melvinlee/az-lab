# KEDA test 4: negative tests.
#   kubectl apply -f manifests/keda-4-negative.yaml
#
# 4a. Fallback: fallback-demo's trigger polls a metrics endpoint that doesn't exist. After 3
#     failed polls the ScaledObject goes Ready=False and holds the Deployment at
#     fallback.replicas (2).
#     kubectl get deploy fallback-demo -w; kubectl describe scaledobject fallback-demo
#
# 4b. Paused replicas: pin test 1/2's ScaledObject at 1 replica regardless of the cron window.
#     kubectl annotate scaledobject inflate-cron autoscaling.keda.sh/paused-replicas="1"
#     kubectl get deploy inflate                                                    # stays at 1
#     kubectl annotate scaledobject inflate-cron autoscaling.keda.sh/paused-replicas-   # resume
#
# 4c. HPA conflict: hpa-conflict below already has a plain HPA, so the KEDA admission
#     webhook rejects the ScaledObject `hpa-conflict` ("already autoscaled by ... HPA").
#     The webhook validates ScaledObjects only; it doesn't block an HPA created afterwards.
#     kubectl apply reports an error for that one object; the rest of this file applies.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fallback-demo
spec:
  replicas: 0
  selector:
    matchLabels:
      app: fallback-demo
  template:
    metadata:
      labels:
        app: fallback-demo
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: pause
          image: mcr.microsoft.com/oss/kubernetes/pause:3.6
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: fallback-demo
spec:
  scaleTargetRef:
    name: fallback-demo
  minReplicaCount: 0
  maxReplicaCount: 5
  pollingInterval: 10
  fallback:
    failureThreshold: 3
    replicas: 2
  triggers:
    # Broken on purpose: no such service. metrics-api uses AverageValue, which fallback requires.
    - type: metrics-api
      metadata:
        url: http://does-not-exist.default.svc.cluster.local:8080/metrics
        valueLocation: value
        targetValue: "5"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-conflict
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-conflict
  template:
    metadata:
      labels:
        app: hpa-conflict
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: pause
          image: mcr.microsoft.com/oss/kubernetes/pause:3.6
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-conflict
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hpa-conflict
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: hpa-conflict
spec:
  scaleTargetRef:
    name: hpa-conflict
  minReplicaCount: 1
  maxReplicaCount: 3
  triggers:
    - type: cron
      metadata:
        timezone: Asia/Singapore
        start: "0 * * * *"
        end: "30 * * * *"
        desiredReplicas: "2"
