# KEDA test 2: KEDA + Karpenter. Same ScaledObject name as test 1, so applying this
# replaces it. 10 replicas x (1 CPU / 1.5Gi) exceeds the `general` NodePool's 16Gi cap:
# expect 2 NodeClaims, ~6 pods Running and the rest Pending. After the window:
# HPA stabilization (60s) -> KEDA cooldown (60s) -> 0 pods -> Karpenter removes empty nodes.
#   kubectl apply -f manifests/keda-2-cron-karpenter.yaml
#   kubectl get deploy inflate -w &  kubectl get nodeclaims -o wide -w
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: inflate-cron
spec:
  scaleTargetRef:
    name: inflate
  minReplicaCount: 0
  maxReplicaCount: 10
  cooldownPeriod: 60
  pollingInterval: 15
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
  triggers:
    - type: cron
      metadata:
        timezone: Asia/Singapore
        start: "*/10 * * * *"
        end: "5-59/10 * * * *"
        desiredReplicas: "10"
